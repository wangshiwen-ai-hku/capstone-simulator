syntax = "proto3";

package edgesched.v2;

// Optional transport-neutral wire contract for external clients.

enum TaskClass {
  TASK_CLASS_UNSPECIFIED = 0;
  LOCAL_SAFETY = 1;
  REALTIME_OFFLOADABLE = 2;
  EDGE_HEAVY = 3;
}

enum TaskState {
  TASK_STATE_UNSPECIFIED = 0;
  BLOCKED = 1;
  READY = 2;
  RUNNING = 3;
  SUCCEEDED = 4;
  FAILED = 5;
  TIMEOUT = 6;
  SKIPPED = 7;
  DROPPED = 8;
}

enum FailurePolicy {
  FAILURE_POLICY_UNSPECIFIED = 0;
  SKIP_DESCENDANTS = 1;
  FAIL_FAST = 2;
}

message TaskSpec {
  string task_type = 1;
  TaskClass task_class = 2;
  double compute_demand = 3;
  double gpu_demand = 4;
  double latency_budget_ms = 5;
  string model_requirement = 6;
  double input_size_mb = 7;
  double output_size_mb = 8;
  double bandwidth_requirement_mbps = 9;
  double energy_budget_j = 10;
  string dominant_resource = 11;
  bool allow_local_fallback = 12;
}

message TaskInstance {
  string task_id = 1;
  string workflow_id = 2;
  string name = 3;
  string source_node_id = 4;
  TaskSpec spec = 5;
  repeated string dependency_task_ids = 6;
  int32 priority = 7;
  int32 stage_index = 8;
  double arrival_time_ms = 9;
  double deadline_time_ms = 10;
  string input_ref = 11;
}

message WorkflowSpec {
  string workflow_id = 1;
  repeated TaskInstance tasks = 2;
  double deadline_time_ms = 3;
  FailurePolicy failure_policy = 4;
  map<string, string> metadata = 5;
}

message ArtifactRef {
  string artifact_id = 1;
  string producer_task_id = 2;
  string node_id = 3;
  double size_mb = 4;
  string uri = 5;
  string checksum = 6;
}

message NodeRegistration {
  string schema_version = 1;
  string node_id = 2;
  string node_kind = 3;
  string architecture = 4;
  repeated string capabilities = 5;
}

message ResourceState {
  string node_id = 1;
  int64 timestamp_ns = 2;
  double cpu_util = 3;
  double gpu_util = 4;
  double memory_used_mb = 5;
  double memory_total_mb = 6;
  double temperature_c = 7;
  double power_w = 8;
  uint32 queue_depth = 9;
  double queued_work_ms = 10;
}

message TaskAssignment {
  string workflow_id = 1;
  string task_id = 2;
  string target_node_id = 3;
  string execution_mode = 4;
  double assigned_time_ms = 5;
  uint32 attempt = 6;
  string reason = 7;
}

message TaskResult {
  string workflow_id = 1;
  string task_id = 2;
  TaskState state = 3;
  bool ok = 4;
  string executed_node_id = 5;
  ArtifactRef artifact = 6;
  double transfer_in_ms = 7;
  double queue_ms = 8;
  double execution_ms = 9;
  double energy_j = 10;
  string error_code = 11;
  uint32 attempt = 12;
}

message SubmitWorkflowRequest { WorkflowSpec workflow = 1; }
message SubmitWorkflowResponse { bool accepted = 1; string workflow_id = 2; string reason = 3; }
message RegisterNodeResponse { bool accepted = 1; string session_id = 2; string reason = 3; }
message Ack { bool accepted = 1; bool duplicate = 2; string reason = 3; }
message Empty {}

service EdgeSchedControlPlane {
  rpc RegisterNode(NodeRegistration) returns (RegisterNodeResponse);
  rpc SubmitWorkflow(SubmitWorkflowRequest) returns (SubmitWorkflowResponse);
  rpc StreamAssignments(Empty) returns (stream TaskAssignment);
  rpc ReportResourceState(ResourceState) returns (Ack);
  rpc ReportTaskResult(TaskResult) returns (Ack);
}
