# fly.toml app configuration file for capstone-simulator-backend

app = "capstone-simulator-backend"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  CORS_ORIGINS = "https://capstone-simulator-sydy.vercel.app,http://localhost:5173,http://127.0.0.1:5173"
  MODEL_PROVIDER = "apiyi"
  APIYI_BASE_URL = "https://api.apiyi.com/v1"
  APIYI_MODEL = "deepseek-v4-flash"
  MARS_TRACE_ARCHIVE = "1"
  MARS_TRACE_DIR = "tmp/mars-traces"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
